<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Alterar Alunos</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">

</head>

<body>
	<div class="container my-2">
		<h1>Cadastro de Alunos</h1>
		<hr>
		<h2>Insira abaixo as informações sobre o Aluno</h2>
		<form action"#" th:action="@{/rh/alunos/salvar}" th:object="${aluno}" method="POST">
			<input type="hidden" id="id" th:field="*{id}">

			<span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-danger"></span>
			<input type="text" th:field="*{nome}" placeholder="Nome" class="form-control mb-4 col-4">

			<input type="date" th:field="*{dataNascimento}" placeholder="Data Nascimento" class="form-control mb-4 col-4"
			 value="" min="1945-01-01" max="2009-01-01">
			 
			<select th:field="*{sexo}" class="form-control mb-4 col-4">
				<option th:each="sexo: ${sexos}" th:value="${sexo.id}" th:text="${sexo.nome}"></option>
			</select>

			<h2>Curso</h2>
			<select th:field="*{curso}" class="form-control mb-4 col-4">
				<option th:each="curso: ${cursos}" th:value="${curso.id}" th:text="${curso.nome}"></option>
			</select>

			<div class="form-group mb-4 col-4">
				<label for="periodo">Periodo:</label>
				<input type="radio" name="periodo" id="periodo" value="Manha" required>
				<label for="periodo" id="botao">Manhã</label>
				<input type="radio" name="periodo" id="periodo" value="Tarde" required>
				<label for="periodo" id="botao">Tarde</label>
			</div>

			<h2>Escola</h2>
			<select th:field="*{escola}" class="form-control mb-4 col-4">
				<option th:each="escola: ${escolas}" th:value="${escola.id}" th:text="${escola.nome}"></option>
			</select>

			<div class="form-group mb-4 col-8">
				<label for="ensino">Ensino:</label>
				<br>
				<input type="radio" name="ensino" id="ensino" value="Infantil" required>
				<label for="periodo" id="botao">Infantil</label>
				<input type="radio" name="ensino" id="ensino" value="Fundamental_I" required>
				<label for="periodo" id="botao">Fundamental I</label>
				<input type="radio" name="ensino" id="ensino" value="Fundamental_II" required>
				<label for="periodo" id="botao">Fundamental II</label>
				<input type="radio" name="ensino" id="ensino" value="EnsinoMedio" required>
				<label for="periodo" id="botao">Ensino Médio</label>
				<input type="radio" name="ensino" id="ensino" value="NaoConcluido" required>
				<label for="periodo" id="botao">Não Concluído</label>
				<input type="radio" name="ensino" id="ensino" value="Concluido" required>
				<label for="periodo" id="botao">Concluído</label>
			</div>

			<h2>Contato</h1>
				<span th:if="${#fields.hasErrors('rua')}" th:errors="*{rua}" class="text-danger"></span>
				<input type="text" th:field="*{rua}" placeholder="Nome da Rua" class="form-control mb-4 col-4">

				<label for="num" class="mb-4">Número da Casa:</label>
				<input type="number" id="num" name="num" min="1" max="9999">

				<select th:field="*{endereco}" class="form-control mb-4">
					<option th:each="endereco: ${enderecos}" th:value="${endereco.id}" th:text="${endereco.nome}">
					</option>
				</select>

				<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
				<input type="text" th:field="*{email}" placeholder="Email" class="form-control mb-4 col-4">

				<span th:if="${#fields.hasErrors('nomeMae')}" th:errors="*{nomeMae}" class="text-danger"></span>
				<input type="text" th:field="*{nomeMae}" placeholder="Nome da Mãe ou Responsável"
					class="form-control mb-4 col-4">

				<span th:if="${#fields.hasErrors('nomePai')}" th:errors="*{nomePai}" class="text-danger"></span>
				<input type="text" th:field="*{nomePai}" placeholder="Nome do Pai" class="form-control mb-4 col-4">

				<span th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}" class="text-danger"></span>
				<input type="text" th:field="*{telefone}" placeholder="Telefone (Principal)"
					class="form-control mb-4 col-4">

				<input type="text" th:field="*{telefone1}" placeholder="Telefone (Secundário)"
					class="form-control mb-4 col-4">
				
				<div class="form-group mb-4 col-4" >
					<label for="status">Situação do Aluno:</label>
					<input type="radio" name="status" id="status" value="Ativo" required>
					<label for="status" id="botao">Ativo</label>
					<input type="radio" name="status" id="status" value="Desativado" required>
					<label for="status" id="botao">Desativado</label>
				</div>

				<button type="submit" class="btn btn-info col-2">Salvar</button>
				<a th:href="@{/rh/alunos}" class="btn btn-primary">Retornar para a lista de Alunos</a>
		</form>
		<hr>
	</div>
</body>

</html>
