<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>PROAQ</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
<script src="/js/script.js"></script>

</head>
<body>
	<header th:insert="fragmentos/geral.html :: header"> </header>
	<div class="container my-2">	
		<h1>Alunos</h1>
		<a th:href="@{/rh/alunos/novo}" class="btn btn-primary btn-sm mb-3">Incluir</a>
		<table border="1" class="table table-striped table-responsive-md">
			<thead>
				<tr>
					<th>Nome</th>
					<th>Curso</th>
					<th>Telefone</th>
					<th>Ações</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="aluno : ${listaAlunos}">
					<td th:text="${aluno.nome}"></td>
					<td th:text="${aluno.curso.nome}"> </td>
					<td th:text="${aluno.telefone}"></td>
					<td>
						<a th:href="@{/rh/alunos/{id}(id=${aluno.id})}" class="btn btn-primary">Alterar</a>
						<a th:href="@{/rh/alunos/{id}/details(id=${aluno.id})}" class="btn btn-warning">Detalhes</a>
						<a th:href="@{/rh/alunos/excluir/{id}(id=${aluno.id})}" class="btn btn-danger">Excluir</a>
					</td>
				</tr>
			</tbody>
		</table>
		<a class="btn btn-primary btn-sm mb-3" href="/">Voltar</a>
	</div>
</body>
</html>
