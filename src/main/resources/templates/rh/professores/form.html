<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>Alterar Professores</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">

</head>
<body>
	<div class="container my-2">
		<h1>Sistema de Gestão de Professores</h1>
		<hr>
		<h2>Editar Professor</h2>
		<form action"#" th:action="@{/rh/professores/salvar}" th:object="${professor}" method="POST">
			<input type="hidden" id="id" th:field="*{id}">
			
			<span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-danger"></span>
			<input type="text" th:field="*{nome}" placeholder="Nome" class="form-control mb-4 col-4">
			
			<input type="date" th:field="*{dataNascimento}" placeholder="Data Nascimento" class="form-control mb-4 col-4">
			
			<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
			<input type="text" th:field="*{email}" placeholder="Email" class="form-control mb-4 col-4">
			
			<select th:field="*{curso}" class="form-control mb-4 col-4">
				<option th:each="curso: ${cursos}" th:value="${curso.id}" th:text="${curso.nome}"></option>
			</select>

			<span th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}" class="text-danger"></span>						
			<input type="text" th:field="*{telefone}" placeholder="Telefone (Principal)" class="form-control mb-4 col-4">

			<input type="text" th:field="*{telefone1}" placeholder="Telefone (Secundario)" class="form-control mb-4 col-4">
						
			<button type="submit" class="btn btn-info col-2">Salvar</button>
			<a th:href="@{/rh/professores}" class="btn btn-primary">Retornar para a lista de Professores</a>
		</form>
		<hr>
		
	</div>
</body>
</html>
