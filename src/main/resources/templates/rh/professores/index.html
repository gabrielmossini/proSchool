<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>PROAQ</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">

</head>
<body>
	<header th:insert="fragmentos/geral.html :: header"> </header>
	<div class="container my-2">
		<h1>Professores</h1>
		<a th:href="@{/rh/professores/novo}" class="btn btn-primary btn-sm mb-3">Inserir</a>
		<table border="1" class="table table-striped table-responsive-md">
			<thead>
				<tr>
					<th>Nome</th>
					<th>Curso</th>
					<th>Ações</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="professor : ${listaProfessores}">
					<td th:text="${professor.nome}"></td>
					<td th:text="${professor.curso.nome}"></td>
					
					<td>
						<a th:href="@{/rh/professores/{id}(id=${professor.id})}" class="btn btn-primary">Alterar</a>
						<a th:href="@{/rh/professores/{id}/details(id=${professor.id})}" class="btn btn-warning">Detalhes</a>
						<a th:href="@{/rh/professores/excluir/{id}(id=${professor.id})}" class="btn btn-danger">Excluir</a>
					</td>
				</tr>
			</tbody>
		</table>
		<a class="btn btn-primary btn-sm mb-3" href="/">Voltar</a>
	</div>
</body>
</html>
