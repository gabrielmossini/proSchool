<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">

</head>
	<header th:insert="fragmentos/geral.html :: header"> </header>
	<div class="container my-2">	
		<h1>Usuários</h1>
		<a th:href="@{/seguranca/usuarios/novo}" class="btn btn-primary btn-sm mb-3">Incluir</a>
		<table border="1" class="table table-striped table-responsive-md">
			<thead>
				<tr>
					<th>CAD</th>
					<th>Nome</th>
<!--					<th>Função</th> -->
					<th>Ações</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="usuario : ${listaUsuarios}">
					<td th:text="${usuario.id}"></td>
					<td th:text="${usuario.nome}"></td>
<!--					<td th:text="${curso.status}"></td> -->
					<td>
						<a th:href="@{/seguranca/usuarios/{id}(id=${usuario.id})}" class="btn btn-primary">Alterar</a>
						<a th:href="@{/seguranca/usuarios/{id}/details(id=${usuario.id})}" class="btn btn-warning">Detalhes</a>
						<a th:href="@{/seguranca/usuarios/excluir/{id}(id=${usuario.id})}" class="btn btn-danger">Excluir</a>
					</td>
				</tr>
			</tbody>
		</table>
		<a class="btn btn-primary btn-sm mb-3" href="/">Voltar</a>
	</div>
<body>

</body>

</html>
