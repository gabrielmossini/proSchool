<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Login</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
	<div class="container">
		<div class="row">
			<div class="col-md-6 offset-md-3">
				<div th:if="${param.error}">
					<div class="alert alert-danger">Nome ou Senha incorretos</div>
				</div>
				<div th:if="${param.logout}">
					<div class="alert alert-success">Você se desconectou.</div>
				</div>
				<div class="card">
					<div class="card-header">
						<h2 class="text-center">Login</h2>
					</div>
					<div class="card-body">
						<form method="post" role="form" th:action="@{/login}" class="form-horizontal">
							<div class="form-group mb-3">
								<label class="control-label"> Usuário</label> <input type="text" id="username"
									name="username" class="form-control" placeholder="Insira o usuário" />
							</div>
							<div class="form-group mb-3">
								<label class="control-label"> Senha</label> <input type="password" id="password"
									name="password" class="form-control" placeholder="Insira a senha" />
							</div>
							<div class="form-group mb-3">
								<button type="submit" class="btn btn-primary">Entrar</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
