<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Inserir Bairros</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
</head>

<body>
	<div class="container my-2">
		<h1>Cadastro de Bairros</h1>
		<hr>
		<h2>Dados sobre o Bairro</h2>
		<form action"#" th:action="@{/core/enderecos/salvar}" th:object="${endereco}" method="POST">
			<input type="hidden" id="id" th:field="*{id}">

			<span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-danger"></span>
			<input type="text" th:field="*{nome}" placeholder="Nome" class="form-control mb-4 col-4">

			<button type="submit" class="btn btn-info col-2">Salvar</button>
			<a th:href="@{/core/enderecos}" class="btn btn-primary">Retornar para a lista de Cursos</a>
		</form>
		<hr>
	</div>
</body>
</html>
