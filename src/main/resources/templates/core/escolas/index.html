<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Escolas - Index</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

</head>

<body>
	<header th:insert="fragmentos/geral.html :: header"> </header>
	<div class="container my-2">
		<h1>Escolas</h1>
		<a th:href="@{/core/escolas/novo}" class="btn btn-primary btn-sm mb-3">Incluir
			<span class="material-symbols-outlined">
				add
			</span>
		</a>
		<a th:href="@{/pdf/escola}" class="btn btn-danger btn-sm mb-3">Download PDF
			<span class="material-symbols-outlined">picture_as_pdf</span>
		</a>

		<table border="1" class="table table-striped table-responsive-md">
			<thead>
				<tr>
					<th>ID</th>
					<th>Nome</th>
					<th>Ensino</th>
					<th>Ações</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="escola : ${listaEscolas}">
					<td th:text="${escola.id}"></td>
					<td th:text="${escola.nome}"></td>
					<td th:text="${escola.ensino}"></td>
					<td>
						<a th:href="@{/core/escolas/{id}(id=${escola.id})}" class="btn btn-warning">Alterar
							<span class="material-symbols-outlined">
								rule_settings
							</span>

						</a>
						<a th:href="@{/core/escolas/excluir/{id}(id=${escola.id})}" class="btn btn-danger">Excluir
							<span class="material-symbols-outlined">
								delete
							</span>

						</a>
					</td>
				</tr>
			</tbody>
		</table>
		<a class="btn btn-primary btn-sm mb-3" href="/administracao/">Voltar</a>
	</div>
</body>

</html>
