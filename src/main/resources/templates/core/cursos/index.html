<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

</head>

<body>
	<header th:insert="fragmentos/geral.html :: header"> </header>
	<div class="container my-2">
		<h1>Cursos</h1>
		<a th:href="@{/core/cursos/novo}" class="btn btn-primary btn-sm mb-3">Incluir
			<span class="material-symbols-outlined">
				add
			</span>
		</a>
		<a th:href="@{/pdf/curso}" class="btn btn-danger btn-sm mb-3">Download PDF
			<span class="material-symbols-outlined">picture_as_pdf</span>
		</a>
		<table border="1" class="table table-striped table-responsive-md">
			<thead>
				<tr>
					<th>ID</th>
					<th>Nome</th>
					<th>Status</th>
					<th>Ações</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="curso : ${listaCursos}">
					<td th:text="${curso.id}"></td>
					<td th:text="${curso.nome}"></td>
					<td th:text="${curso.status}"></td>
					<td>
						<a th:href="@{/core/cursos/{id}(id=${curso.id})}" class="btn btn-warning">Alterar
							<span class="material-symbols-outlined">
								rule_settings
							</span>
						</a>
						<a th:href="@{/core/cursos/excluir/{id}(id=${curso.id})}" class="btn btn-danger">
							<span class="material-symbols-outlined">
								delete
							</span>
						</a>
					</td>
				</tr>
			</tbody>
		</table>
		<a class="btn btn-primary btn-sm mb-3" href="/administracao/">Voltar</a>
	</div>
</body>

</html>
