<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="headerfiles">
	<meta charset="UTF-8">
	<title>Fragmento Geral</title>

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
		integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
	

	<script src="https://code.jquery.com/jquery-3.5.1.js"
		integrity="sha256-QWo7LDvxbWT2tbbQ97B53yJnYU3WhH/C8ycbRAkjPDc=" crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"
		integrity="sha256-T0Vest3yCU7pafRw9r+settMBX6JkKN06dqBnpQ8d30=" crossorigin="anonymous"></script>
</head>

<body>
	<div th:fragment="header">
		<nav class="navbar navbar-expand-lg navbar-light bg-light" role="navigation">
			<div class="container-fluid">
				<div class="navbar-header">
				<img src="https://cdn-icons-png.flaticon.com/512/6415/6415791.png" alt="Logo" width="50" height="50">
					<a class="btn-outline-primary" href="/">Centro Comunitário</a>
				</div>
				<ul class="nav navbar-nav navbar-right">
					<li class="nav-item">
						<form name="logoutForm" th:action="@{/logout}" method="post">
							<span sec:authentication="name"></span>
							<a class="btn btn-outline-danger" aria-current="page" th:href="@{/logout}">Sair</a>
						</form>
					</li>
				</ul>
			</div>
		</nav>
	</div>
</body>

</html>
